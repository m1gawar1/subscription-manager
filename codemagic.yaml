workflows:

  # ── Android (デバッグ・動作確認用) ───────────────────────────
  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      node: 22.12.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true

  # ── Android (Google Play リリース) ────────────────────────────
  android-release:
    name: Android Release (Google Play)
    max_build_duration: 60
    environment:
      node: 22.12.0
      java: 17
      android_signing:
        - substracker_keystore
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android AAB (release)
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS (App Store) ───────────────────────────────────────────
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 60
    integrations:
      app_store_connect: SubsTracker
    environment:
      groups:
        - ios_credential
      node: 22.12.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.subscmanager.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set app version
        script: |
          cd ios/App
          APP_ID="$APP_APPLE_ID"

          # プロジェクトの現在のマーケティングバージョン（例: 1.0.2）
          CURRENT_MV=$(grep -m1 'MARKETING_VERSION' App.xcodeproj/project.pbxproj | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')

          # App Store で公開済み(READY_FOR_SALE)の最新バージョンを取得（取得失敗時は空）
          RELEASED_MV=$(app-store-connect list-app-store-versions "$APP_ID" --app-store-state READY_FOR_SALE 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V | tail -1)

          # 公開済みバージョン >= 現在のバージョンのときだけパッチを+1（衝突回避）。
          # それ以外（まだ未リリース／API取得失敗）は現在のバージョンを維持。
          NEW_MV="$CURRENT_MV"
          if [ -n "$RELEASED_MV" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$CURRENT_MV" "$RELEASED_MV" | sort -V | tail -1)
            if [ "$HIGHEST" = "$RELEASED_MV" ]; then
              MAJOR=$(echo "$RELEASED_MV" | cut -d. -f1)
              MINOR=$(echo "$RELEASED_MV" | cut -d. -f2)
              PATCH=$(echo "$RELEASED_MV" | cut -d. -f3); PATCH=${PATCH:-0}
              NEW_MV="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          echo "Marketing version: $CURRENT_MV -> $NEW_MV (released: ${RELEASED_MV:-none})"
          agvtool new-marketing-version "$NEW_MV"

          # ビルド番号は常に TestFlight 最新+1
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))

      - name: Build iOS (App Store)
        script: |
          xcode-project use-profiles
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ios/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual
          app-store-connect fetch-signing-files \
            com.subscmanager.app \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles
          xcodebuild \
            -exportArchive \
            -archivePath ios/App.xcarchive \
            -exportPath ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true
