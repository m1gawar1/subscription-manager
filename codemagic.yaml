workflows:

  # ── Android ──────────────────────────────────────────────
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com        # ← ご自身のメールアドレスに変更してください
        notify:
          success: true
          failure: true

  # ── iOS ──────────────────────────────────────────────────
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      node: 20.x
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS (simulator用)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/App.app

    publishing:
      email:
        recipients:
          - your@email.com        # ← ご自身のメールアドレスに変更してください
        notify:
          success: true
          failure: true
