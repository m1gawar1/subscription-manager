workflows:

  # ── Android ──────────────────────────────────────────────
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS (App Store) ───────────────────────────────────────
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 60
    integrations:
      app_store_connect: SubsTracker
    environment:
      node: 20.x
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.subscmanager.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set app version
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))

      - name: Build iOS (App Store)
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual
          xcodebuild \
            -exportArchive \
            -archivePath ios/App.xcarchive \
            -exportPath ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

    artifacts:
      - ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true
